name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Ruff (Lint)
        run: poetry run ruff check .

      - name: Run Ruff (Format)
        run: poetry run ruff format --check .

      - name: Run Isort
        run: poetry run isort --check-only .

      - name: Run MyPy
        run: poetry run mypy .

      - name: Run Pylint
        run: poetry run pylint api

      - name: Run Bandit
        run: poetry run bandit -r api

      - name: Run Pip-audit
        run: |
          # Run pip-audit and capture output in JSON format
          # We use || true to prevent the step from failing immediately
          poetry run pip-audit --format json > pip-audit-report.json || true

          # Check if there are any fixable vulnerabilities
          # .dependencies[].vulns[] | select(.fix_versions | length > 0)
          FIXABLE_VULNS=$(jq -r '.dependencies[] | select(.vulns) | .vulns[] | select(.fix_versions | length > 0) | .id' pip-audit-report.json)

          if [ ! -z "$FIXABLE_VULNS" ]; then
            echo "::error::Found fixable vulnerabilities: $FIXABLE_VULNS"
            # Print the report for context
            cat pip-audit-report.json
            exit 1
          else
            echo "No fixable vulnerabilities found. Ignoring unfixed."
            exit 0
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Start Services
        run: docker compose up -d --wait --build db redis

      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/fastapi_template
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test_secret_key
        run: poetry run pytest
