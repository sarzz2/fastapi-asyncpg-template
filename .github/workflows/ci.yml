name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # Use service containers for postgres + redis (faster than docker-compose)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fastapi_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d fastapi_template"
          --health-interval 2s --health-timeout 2s --health-retries 15

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 2s --health-timeout 2s --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --only main --with test


      # Wait for Postgres service to be healthy (pg_isready)
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker ps --format '{{.Names}}\t{{.Image}}' | grep -E 'postgres:17' && break || sleep 1
          done
          # wait for pg_isready via docker exec on the container that runs postgres:17
          PG_CONTAINER=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)
          if [ -z "$PG_CONTAINER" ]; then
            echo "Postgres container not found"
            docker ps -a
            exit 1
          fi
          for i in $(seq 1 60); do
            docker exec -u postgres "$PG_CONTAINER" pg_isready -U user -d fastapi_template && break
            sleep 1
          done
          docker exec -u postgres "$PG_CONTAINER" pg_isready -U user -d fastapi_template

      # Install build dependencies and compile pg_uuidv7 inside the running postgres container
      - name: Install and build pg_uuidv7 in Postgres service container
        run: |
          PG_CONTAINER=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)
          if [ -z "$PG_CONTAINER" ]; then
            echo "Postgres container not found"
            docker ps -a
            exit 1
          fi

          # Update apt & install build dependencies as root inside the container.
          # Use -u root so apt works.
          docker exec -u root "$PG_CONTAINER" bash -lc "apt-get update && apt-get install -y git make gcc postgresql-server-dev-17 && rm -rf /var/lib/apt/lists/*"

          # Clone, build and install pg_uuidv7
          docker exec -u root "$PG_CONTAINER" bash -lc "git clone https://github.com/fboulnois/pg_uuidv7.git /tmp/pg_uuidv7 && cd /tmp/pg_uuidv7 && make && make install && rm -rf /tmp/pg_uuidv7"

          # Make sure extension is visible to postgres and create it in the DB (run as postgres user)
          docker exec -u postgres "$PG_CONTAINER" bash -lc "psql -v ON_ERROR_STOP=1 -U user -d fastapi_template -c \"CREATE EXTENSION IF NOT EXISTS pg_uuidv7;\""

      - name: Verify pg_uuidv7 is installed
        run: |
          PG_CONTAINER=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)
          docker exec -u postgres "$PG_CONTAINER" psql -U user -d fastapi_template -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'pg_uuidv7';"

      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/fastapi_template
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          SECRET_KEY: test_secret_key
        run: poetry run pytest -q
