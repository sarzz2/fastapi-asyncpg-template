name: Checks

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Linting (Ruff & Isort)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --only main --with dev

      - name: Run Ruff (Lint)
        run: poetry run ruff check .

      - name: Run Ruff (Format)
        run: poetry run ruff format --check .

      - name: Run Isort
        run: poetry run isort --check-only .

  types:
    name: Type Checking (MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --only main --with dev --with test

      - name: Cache MyPy
        uses: actions/cache@v5
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            mypy-${{ runner.os }}-

      - name: Run MyPy
        run: poetry run mypy .

  pylint:
    name: Code Quality (Pylint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --only main --with dev --with test

      - name: Run Pylint
        run: poetry run pylint api

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --only main --with dev

      - name: Run Bandit
        run: poetry run bandit -r api

      - name: Run Pip-audit
        run: |
          poetry run pip-audit --format json > pip-audit-report.json || true
          FIXABLE_VULNS=$(jq -r '.dependencies[] | select(.vulns) | .vulns[] | select(.fix_versions | length > 0) | .id' pip-audit-report.json)
          if [ ! -z "$FIXABLE_VULNS" ]; then
            echo "::error::Found fixable vulnerabilities: $FIXABLE_VULNS"
            cat pip-audit-report.json
            exit 1
          else
            echo "No fixable vulnerabilities found. Ignoring unfixed."
          fi
