[tool.poetry]
name = "fastapi-template"
version = "0.1.0"
description = ""
authors = ["Sarthak singh <sarthaksingh2001@gmail.com>"]
readme = "README.md"
packages = [{ include = "api" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.124.0"
asyncpg = "^0.31.0"
colorlog = "^6.10.1"
bcrypt = "^5.0.0"
redis = "^7.0.1"
python-jose = "^3.5.0"
pyjwt = "^2.10.1"
orjson = "^3.11.4"
pre-commit = "^4.3.0"
boto3 = "^1.42.4"
celery = "^5.5.3"
asgiref = "^3.10.0"
authlib = "^1.6.5"
itsdangerous = "^2.2.0"
pydantic-settings = "^2.12.0"
uvicorn = { extras = ["standard"], version = "^0.38.0" }
pyinstrument = "^5.0.0"
prometheus-fastapi-instrumentator = "^7.1.0"
slowapi = "^0.1.9"
python-json-logger = "^4.0.0"
sentry-sdk = "^2.47.0"
secure = "^1.0.1"
babel = "^2.17.0"


[tool.poetry.group.dev.dependencies]
mypy = "^1.18.2"
fastapi = { extras = ["standard"], version = "^0.124.0" }
pylint = "^4.0.2"
ruff = "^0.14.8"
pytest = "^9.0.1"
httpx = "^0.28.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
isort = "^7.0.0"
bandit = "^1.9.2"
pip-audit = "^2.10.0"
pytest-xdist = "^3.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.fastapi]
entrypoint = "api.main:app"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "asyncpg.*",
  "celery.*",
  "boto3.*",
  "botocore.*",
  "jose.*",
  "psutil.*",
  "uvicorn.*",
  "slowapi.*",
  "pythonjsonlogger.*",
  "secure.*",
  "sentry_sdk.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable the same rules as flake8, and add isort rules (I)
# Enable the same rules as flake8, and add isort rules (I)
select = ["E", "F", "W", "I"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
addopts = "-n auto -v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
