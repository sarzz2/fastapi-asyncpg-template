[project]
name = "fastapi-template"
version = "0.1.1"
description = ""
authors = [{ name = "Sarthak singh", email = "sarthaksingh2001@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "asyncpg>=0.31.0",
  "colorlog>=6.12.0",
  "bcrypt>=5.0.0",
  "redis>=8.1.0",
  "pyjwt>=2.13.0",
  "pre-commit>=4.6.2",
  "starlette-admin>=1.0.1",
  "boto3>=1.43.85",
  "celery>=5.6.3",
  "asgiref>=3.12.1",
  "authlib>=1.8.0",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.15.0",
  "email-validator>=2.3.0",
  "httpx>=0.28.1",
  "uvicorn[standard]>=0.52.4",
  "prometheus-fastapi-instrumentator>=8.1.0",
  "slowapi>=0.1.10",
  "python-json-logger>=4.2.0",
  "sentry-sdk>=2.68.1",
  "babel>=2.18.0",
  "flagsmith>=6.2.3",
  "tenacity>=9.1.4",
  "werkzeug==3.1.8",
  "sendgrid>=6.12.5",
  "jinja2>=3.1.6",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp>=1.44.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "opentelemetry-instrumentation-asyncpg>=0.65b0",
  "opentelemetry-instrumentation-redis>=0.65b0",
  "opentelemetry-instrumentation-celery>=0.65b0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "opentelemetry-instrumentation-botocore>=0.65b0",
  "opentelemetry-instrumentation-logging>=0.65b0",
  "pyroscope-io>=1.2.1",
  "pyinstrument>=5.1.3",
]

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pylint>=4.0.8",
  "ruff>=0.16.5",
  "isort>=9.0.1",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
]
test = [
  "pytest>=9.1.1",
  "httpx>=0.28.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "httpx-ws>=0.9.0",
  "fastapi[standard]>=0.141.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]


[tool.fastapi]
entrypoint = "api.main:app"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "asyncpg.*",
  "celery.*",
  "boto3.*",
  "botocore.*",
  "psutil.*",
  "uvicorn.*",
  "slowapi.*",
  "pythonjsonlogger.*",
  "secure.*",
  "sentry_sdk.*",
  "sendgrid.*",
  "opentelemetry.*",
  "pyroscope.*",

]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "off"
reportDeprecated = "none"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable the same rules as flake8, and add isort rules (I)
# Enable the same rules as flake8, and add isort rules (I)
select = ["E", "F", "W", "I"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
addopts = "-n auto -v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = [
  "tests/*",
  "tests/**/*",
  "api/core/feature_flags.py",
  "api/core/i18n.py",
  "api/core/logging_config.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pylint.main]
source-roots = ["."]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "too-few-public-methods",
  "no-name-in-module",
  "invalid-name",
  "too-many-positional-arguments",
]

[tool.pylint.design]
max-args = 8
