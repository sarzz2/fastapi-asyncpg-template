[tool.poetry]
name = "fastapi-template"
version = "0.1.1"
description = ""
authors = ["Sarthak singh <sarthaksingh2001@gmail.com>"]
readme = "README.md"
packages = [{ include = "api" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.138.2"
asyncpg = "^0.31.0"
colorlog = "^6.10.1"
bcrypt = "^5.0.0"
redis = "^8.0.1"
pyjwt = "^2.13.0"
pre-commit = "^4.6.0"
boto3 = "^1.43.36"
celery = "^5.6.2"
asgiref = "^3.11.1"
authlib = "^1.7.1"
itsdangerous = "^2.2.0"
pydantic-settings = "^2.14.2"
uvicorn = { extras = ["standard"], version = "^0.49.0" }
prometheus-fastapi-instrumentator = "^8.0.2"
slowapi = "^0.1.10"
python-json-logger = "^4.0.0"
sentry-sdk = "^2.63.0"
babel = "^2.18.0"
flagsmith = "^6.0.0"
tenacity = "^9.1.4"
werkzeug = "3.1.8"
sendgrid = "^6.12.5"
jinja2 = "^3.1.6"
opentelemetry-api = "^1.29.0"
opentelemetry-sdk = "^1.29.0"
opentelemetry-exporter-otlp = "^1.29.0"
opentelemetry-instrumentation-fastapi = "^0.50b0"
opentelemetry-instrumentation-asyncpg = "^0.50b0"
opentelemetry-instrumentation-redis = "^0.50b0"
opentelemetry-instrumentation-celery = "^0.50b0"
pyroscope-io = "^1.0.12"
pyinstrument = "^5.1.2"


[tool.poetry.group.dev.dependencies]
mypy = "^2.1.0"
pylint = "^4.0.6"
ruff = "^0.15.20"
isort = "^8.0.1"
bandit = "^1.9.4"
pip-audit = "^2.10.1"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"
httpx = "^0.28.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
pytest-xdist = "^3.8.0"
httpx-ws = "^0.9.0"
fastapi = { extras = ["standard"], version = "^0.138.2" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.fastapi]
entrypoint = "api.main:app"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "asyncpg.*",
  "celery.*",
  "boto3.*",
  "botocore.*",
  "psutil.*",
  "uvicorn.*",
  "slowapi.*",
  "pythonjsonlogger.*",
  "secure.*",
  "sentry_sdk.*",
  "sendgrid.*",
  "opentelemetry.*",
  "pyroscope.*",

]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enable the same rules as flake8, and add isort rules (I)
# Enable the same rules as flake8, and add isort rules (I)
select = ["E", "F", "W", "I"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
addopts = "-n auto -v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = [
  "tests/*",
  "tests/**/*",
  "api/core/feature_flags.py",
  "api/core/i18n.py",
  "api/core/logging_config.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
