repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-toml
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        name: ruff linter
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff formatter

  - repo: local # Grouping for locally-run hooks
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        types: [python]
        require_serial: true
        additional_dependencies:
          - pylint
          - pydantic
          - asyncpg
          - fastapi
          - bcrypt
          - python-jose
          - colorlog
          - PyJWT
          - redis
          - boto3
          - celery
          - httpx

      - id: mypy
        name: mypy
        entry: mypy
        language: python
        types: [python]
        require_serial: true
        additional_dependencies:
          - mypy
          - pydantic
          - asyncpg
          - fastapi
          - bcrypt
          - python-jose
          - colorlog
          - PyJWT
          - redis
          - httpx

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.2
    hooks:
      - id: pip-audit

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: ["-s", "B101,B404,B603,B607"] # Example: skip assert, subprocess, shell, and start_process_with_a_shell checks
