repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: check-json
          - id: check-yaml
          - id: end-of-file-fixer
          - id: check-added-large-files
          - id: check-case-conflict
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: check-toml
          - id: check-ast

    - repo: https://github.com/pycqa/isort
      rev: 5.13.2
      hooks:
          - id: isort
            name: isort
            args: ["--profile", "black", "--filter-files"]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.6.2
      hooks:
          - id: ruff
            name: ruff linter
            args: [--fix, --exit-non-zero-on-fix]
          - id: ruff-format
            name: ruff formatter

    - repo: local # Grouping for locally-run hooks
      hooks:
          - id: pylint
            name: pylint
            entry: pylint
            language: python
            types: [python]
            require_serial: true
            additional_dependencies:
                - pylint
                - pydantic
                - asyncpg
                - fastapi
                - bcrypt
                - python-jose
                - colorlog
                - PyJWT
                - redis
                - boto3
                - celery
                - httpx
                - pydantic-settings
                - uvicorn
                - pytest
                - prometheus_client
                - prometheus_fastapi_instrumentator
                - pyroscope-io
                - opentelemetry-api
                - opentelemetry-sdk
                - opentelemetry-instrumentation-fastapi
                - opentelemetry-instrumentation-asyncpg
                - opentelemetry-instrumentation-redis
                - opentelemetry-instrumentation-celery
                - opentelemetry-exporter-otlp-proto-grpc
                - slowapi
                - python-json-logger
                - secure
                - sentry-sdk
                - flagsmith
                - tenacity
                - sendgrid
                - jinja2
                - pyinstrument

          - id: mypy
            name: mypy
            entry: mypy
            language: python
            types: [python]
            require_serial: true
            additional_dependencies:
                - mypy
                - pydantic
                - asyncpg
                - fastapi
                - bcrypt
                - python-jose
                - colorlog
                - PyJWT
                - redis
                - httpx
                - pydantic-settings
                - pytest
                - prometheus_client
                - prometheus_fastapi_instrumentator
                - pyroscope-io
                - opentelemetry-api
                - opentelemetry-sdk
                - opentelemetry-instrumentation-fastapi
                - opentelemetry-instrumentation-asyncpg
                - opentelemetry-instrumentation-redis
                - opentelemetry-instrumentation-celery
                - opentelemetry-exporter-otlp-proto-grpc
                - slowapi
                - python-json-logger
                - secure
                - sentry-sdk
                - flagsmith
                - tenacity
                - sendgrid
                - jinja2
                - pyinstrument

    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.18.0
      hooks:
          - id: gitleaks

    - repo: local
      hooks:
          - id: pip-audit-check
            name: pip-audit check
            entry: scripts/pip_audit_check.sh
            language: system
            pass_filenames: false
            always_run: true

    - repo: https://github.com/PyCQA/bandit
      rev: 1.7.6
      hooks:
          - id: bandit
            args: ["-s", "B101,B404,B603,B607", "--exclude", "tests/"]
