repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.5.0
      hooks:
          - id: check-json
          - id: check-yaml
          - id: end-of-file-fixer
          - id: check-added-large-files
            exclude: ^uv\.lock$
          - id: check-case-conflict
          - id: trailing-whitespace
            args: [--markdown-linebreak-ext=md]
          - id: check-toml
          - id: check-ast

    - repo: https://github.com/pycqa/isort
      rev: 5.13.2
      hooks:
          - id: isort
            name: isort
            args: ["--profile", "black", "--filter-files"]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.6.2
      hooks:
          - id: ruff
            name: ruff linter
            args: [--fix, --exit-non-zero-on-fix]
          - id: ruff-format
            name: ruff formatter

    - repo: local # Grouping for locally-run hooks
      hooks:
          - id: pylint
            name: pylint
            entry: uv run pylint
            language: system
            types: [python]
            require_serial: true

          - id: mypy
            name: mypy
            entry: uv run mypy
            language: system
            types: [python]
            require_serial: true

    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.18.0
      hooks:
          - id: gitleaks

    - repo: local
      hooks:
          - id: pip-audit-check
            name: pip-audit check
            entry: scripts/pip_audit_check.sh
            language: system
            pass_filenames: false
            always_run: true

    - repo: https://github.com/PyCQA/bandit
      rev: 1.7.6
      hooks:
          - id: bandit
            args: ["-s", "B101,B404,B603,B607", "--exclude", "tests/"]
