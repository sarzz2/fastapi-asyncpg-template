  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: fastapi_postgres_exporter
    environment:
      DATA_SOURCE_NAME: postgresql://user:password@db:5432/fastapi_template?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - app_network
    depends_on:
      - db

  redis_exporter:
    image: oliver006/redis_exporter
    container_name: fastapi_redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - app_network
    depends_on:
      - redis

  # flower:
  #   image: mher/flower
  #   container_name: fastapi_flower
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/0
  #     - FLOWER_PORT=5555
  #   ports:
  #     - "5555:5555"
  #   networks:
  #     - app_network
  #   depends_on:
  #     - redis
  #     - celery_worker

  prometheus:
    image: prom/prometheus
    container_name: fastapi_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana
    container_name: fastapi_grafana
    ports:
      - "3000:3000"
    networks:
      - app_network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: signoz-clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  signoz-query-service:
    image: signoz/query-service:latest
    container_name: signoz-query-service
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - app_network

  signoz-frontend:
    image: signoz/frontend:latest
    container_name: signoz-frontend
    ports:
      - "3301:3301"
    environment:
      - FRONTEND_PORT=3301
    depends_on:
      - signoz-query-service
    networks:
      - app_network

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:latest
    container_name: signoz-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=signoz-collector
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-query-service:
        condition: service_started
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  # localstack_data:
  prometheus_data:
  grafana_data:
  clickhouse_data:
