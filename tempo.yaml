server:
  http_listen_port: 3200
  http_listen_address: 0.0.0.0

stream_over_http_enabled: true

# Expose OTLP receivers on all interfaces so other containers can connect
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Single-node ingester — ring uses inmemory kvstore
ingester:
  lifecycler:
    join_after: 0s
    ring:
      replication_factor: 1
      kvstore:
        store: inmemory
  max_block_duration: 5m

# Local filesystem storage for traces
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
