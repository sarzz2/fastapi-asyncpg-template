global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'fastapi'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:8000']

  - job_name: 'postgres'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'redis'
    scrape_interval: 5s
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: 'celery'
    scrape_interval: 5s
    static_configs:
      - targets: ['flower:5555']
